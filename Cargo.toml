[workspace]
members = ["crates/json", "crates/crypto", "crates/http", "crates/grafana", "crates/store-sqlite", "crates/server"]
exclude = ["upstream", "upstream-bin", "upstream-prometheus"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
